{% extends "base.html" %}
{% block title %}Run History – {{ app_name }}{% endblock %}

{% block content %}
<div class="mb-6 flex items-center justify-between">
  <div>
    <h1 class="text-3xl font-bold text-white">Run History</h1>
    <p class="text-gray-400 text-sm mt-1">All crew runs, newest first.</p>
  </div>
</div>

<div hx-get="/api/runs/ui/list"
     hx-trigger="load, every 5s"
     hx-target="this">
  <p class="text-gray-500 text-sm">Loading...</p>
</div>
{% endblock %}
