<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}{{ app_name }}{% endblock %}</title>

  <!-- Tailwind CSS (CDN for development) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- HTMX -->
  <script src="https://unpkg.com/htmx.org@2.0.2"
          integrity="sha384-Y7hw+L/jvKeWIRRkqWYfPcvVxHzVzn5REgzbawhxAuQGwX1XWe70vji+VSeHOThJ"
          crossorigin="anonymous"></script>

  <!-- HTMX SSE extension -->
  <script src="https://unpkg.com/htmx-ext-sse@2.2.1/sse.js"></script>

  <!-- Marked.js for markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    [x-cloak] { display: none !important; }
    .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
    .htmx-request .htmx-indicator { opacity: 1; }
    .htmx-request.htmx-indicator { opacity: 1; }
  </style>
  {% block head %}{% endblock %}
</head>
<body class="h-full bg-gray-950 text-gray-100 font-sans">

  <!-- Sidebar -->
  <div class="flex h-full">
    <aside class="w-64 bg-gray-900 border-r border-gray-800 flex flex-col shrink-0">
      <div class="p-4 border-b border-gray-800">
        <a href="/" class="flex items-center gap-2">
          <span class="text-2xl">🤖</span>
          <span class="font-bold text-lg tracking-tight">{{ app_name }}</span>
        </a>
      </div>

      <nav class="flex-1 overflow-y-auto p-3 space-y-1">
        <a href="/"
           class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm hover:bg-gray-800 transition-colors">
          🏠 Dashboard
        </a>
        <a href="/runs"
           class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm hover:bg-gray-800 transition-colors">
          📋 Run History
        </a>
        <a href="/architecture"
           class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm hover:bg-gray-800 transition-colors text-sky-400">
          🏛️ Architecture Hub
        </a>
        <a href="/benchmark"
           class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm hover:bg-gray-800 transition-colors text-emerald-400">
          📊 Benchmark & ROI
        </a>

        <div class="pt-4 pb-1 px-3">
          <p class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Crews</p>
        </div>
        {% for crew in crews %}
        <a href="/crews/{{ crew.name }}"
           class="flex items-center gap-2 px-3 py-2 rounded-lg text-sm hover:bg-gray-800 transition-colors">
          ⚡ {{ crew.name | title }}
        </a>
        {% endfor %}
      </nav>

      <div class="p-3 border-t border-gray-800">
        <a href="/api/docs"
           target="_blank"
           class="flex items-center gap-2 px-3 py-2 rounded-lg text-xs text-gray-400 hover:bg-gray-800 transition-colors">
          📖 API Docs
        </a>
      </div>
    </aside>

    <!-- Main content -->
    <main class="flex-1 overflow-y-auto">
      <div class="max-w-5xl mx-auto p-8">
        {% block content %}{% endblock %}
      </div>
    </main>
  </div>

  {% block scripts %}{% endblock %}
</body>
</html>
